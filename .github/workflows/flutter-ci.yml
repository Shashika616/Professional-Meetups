name: Flutter CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, not `channel: stable` — an unpinned channel drifts to whatever
      # Dart/Flutter release is current on the day CI happens to run, which
      # silently changes `dart format`'s output style (see the tall-style
      # formatter break fixed in this same commit) and can flip analyzer
      # rules underneath you. Bump this deliberately, in step with the
      # Flutter SDK developers actually run locally, not passively.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
