# Generates the query layer from db/migrations + internal/repository/queries
# — same setup as services/auth/sqlc.yaml (see its comment for the "why").
version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/repository/queries"
    schema: "../../db/migrations"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/repository/sqlcgen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
